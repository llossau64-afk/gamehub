<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14110f">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14110f; }
    body { position: fixed; inset: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #f1e8da;
           -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #14110f; touch-action: none; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 22px; padding: 0 16px; background: radial-gradient(ellipse at center, #2a221c 0%, #14110f 70%); transition: opacity .4s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: clamp(26px, 6vw, 48px); letter-spacing: .04em; text-align: center; }
    #bar { width: min(420px, 80vw); height: 10px; border-radius: 6px; background: #3a2f27; overflow: hidden; box-shadow: inset 0 0 0 1px #4d3f34; }
    #bar-fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #c9973f, #e9c46a); transition: width .15s linear; }
    #status { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #b8a58f; min-height: 1.2em; text-align: center; }
    #loading.error #bar-fill { background: #b5483a; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="status">Loading</div>
    </div>
  </div>

  <!-- CrazyGames SDK v3. Loaded before the Unity loader; when the host is not CrazyGames (or the script is blocked)
       the game detects that and runs without portal features. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <script>
    (function () {
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#bar-fill");
      var status = document.querySelector("#status");
      var state = window.__barberPlatform = { initDone: false, ready: false, adblock: -1 };

      // Keep arrow keys / space from scrolling the page and block the browser context menu on the game.
      window.addEventListener("keydown", function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) !== -1) e.preventDefault();
      }, { passive: false });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      window.addEventListener("click", function () { canvas.focus(); });

      function showError(message) {
        loading.classList.add("error");
        status.textContent = message;
      }

      // Start the SDK before Unity so portal data (cloud saves) is available when the game boots.
      function initPlatform() {
        var cg = window.CrazyGames;
        if (!cg || !cg.SDK) { state.initDone = true; return Promise.resolve(); }
        var settle = function (ok) {
          state.initDone = true;
          state.ready = ok && cg.SDK.environment !== "disabled";
          if (state.ready) {
            try { cg.SDK.game.loadingStart(); state.loading = true; } catch (e) { }
          }
        };
        var init;
        try { init = Promise.resolve(cg.SDK.init()); } catch (e) { settle(false); return Promise.resolve(); }
        state.initPromise = init.then(function () { settle(true); }, function () { settle(false); });
        // Never wait longer than a few seconds for the portal.
        return Promise.race([state.initPromise, new Promise(function (resolve) { setTimeout(resolve, 5000); })]);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); }
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () { showError("Could not load the game. Please reload the page."); };
      script.onload = function () {
        initPlatform().then(function () {
          createUnityInstance(canvas, config, function (progress) {
            var percent = Math.round(progress * 100);
            fill.style.width = percent + "%";
            status.textContent = progress < 0.9 ? "Loading " + percent + "%" : "Starting";
          }).then(function () {
            loading.classList.add("done");
            setTimeout(function () { loading.style.display = "none"; }, 450);
            canvas.focus();
          }).catch(function (message) {
            showError(typeof message === "string" ? message : "Something went wrong while starting the game.");
          });
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
