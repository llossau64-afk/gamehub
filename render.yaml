# Render Blueprint: the online game server for the browser version (also hosts the game page at its root URL).
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: gta-quiz-llossau
    runtime: node
    branch: claude/beautiful-einstein-76uwj5
    rootDir: GuessTheAnswer/WebServer
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    plan: free
    autoDeploy: true
