<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Tower of God: a fast roguelite tower climber. Forty floors, eight worlds, four bosses, and Argus waiting at the top.">
<title>Tower of God</title>
<link rel="preload" href="fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx2d"></canvas>
<div id="vignette"></div>
<div id="hurt"></div>
<div id="fade"></div>

<div id="letterbox">
  <div class="bar top"></div><div class="bar bottom"></div>
  <div class="boss-card"><div class="sub"></div><div class="name"></div></div>
</div>

<!-- In-run HUD -->
<div id="hud">
  <div class="hud-tl">
    <div class="hp">
      <div class="hp-bar"><div class="hp-lag"></div><div class="hp-fill"></div></div>
      <span class="hp-num"></span>
    </div>
    <div class="dash-pips"></div>
  </div>
  <div class="hud-tc">
    <div class="floor-label">FLOOR <b>01</b></div>
    <div class="room-info"></div>
    <div class="boss-bar"><div class="boss-name"></div><div class="bb"><div class="bb-lag"></div><div class="bb-fill"></div></div></div>
    <div id="objective"><div class="obj-label"></div><div class="obj-text"><i class="obj-check"></i><span></span></div><div class="obj-hint"></div></div>
  </div>
  <div class="hud-tr">
    <div class="coins"><i class="coin-ico"></i><span>0</span></div>
    <button id="pause-btn" class="icon-btn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  </div>
  <div class="hud-bl build"></div>
  <div id="power-slot"><div class="ps-ico"></div><div class="ps-cd"></div><span class="ps-key">Q</span><span class="ps-lv"></span></div>
</div>

<!-- Touch controls -->
<div id="touch-zone"></div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="touch-btns">
  <button id="btn-dash" aria-label="Dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 H13 L10 5 M13 8 L10 11"/><path d="M9 16 H20 L17 13 M20 16 L17 19"/></svg><span>DASH</span></button>
  <button id="btn-skill" aria-label="Power"><span class="ps-ico"></span><span class="ps-cd"></span></button>
  <button id="btn-attack" aria-label="Attack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 L16 8 M14 5 L19 10 M8 13 L11 16 M4 20 L6 18"/></svg></button>
</div>

<!-- Screens (content filled by ui.js) -->
<section id="menu" class="screen">
  <div class="menu-col">
    <div class="title-block">
      <div class="indicator"><span class="ind-arrow">▲</span><span class="ind-num">00</span><span class="ind-label">BEST</span></div>
      <h1 class="title"><span>TOWER</span><span>OF GOD</span></h1>
    </div>
    <nav class="menu-list">
      <button data-act="play" class="mi mi-play">PLAY</button>
      <button data-act="shop" class="mi">SHOP<i class="dot"></i></button>
      <button data-act="mastery" class="mi">MASTERY</button>
      <button data-act="register" class="mi">REGISTER</button>
      <button data-act="settings" class="mi">SETTINGS</button>
    </nav>
  </div>
  <footer class="menu-foot">
    <div class="stat"><i class="coin-ico"></i><b class="m-coins">0</b></div>
    <div class="stat lvl"><span class="m-level">LV 1</span><div class="xpbar"><i></i></div></div>
    <div class="hint m-hint"></div>
  </footer>
</section>

<section id="upgrades" class="screen panel-screen"></section>
<section id="shop" class="screen panel-screen"></section>
<section id="mastery" class="screen panel-screen"></section>
<section id="register" class="screen panel-screen"></section>
<section id="choice" class="screen"></section>
<section id="revive" class="screen"></section>
<section id="daily" class="screen panel-screen"></section>
<section id="skins" class="screen panel-screen"></section>
<section id="settings" class="screen panel-screen"></section>
<section id="chestopen" class="screen"></section>
<section id="cards" class="screen"></section>
<section id="results" class="screen"></section>
<section id="pause" class="screen"></section>

<!-- Intercom dialog -->
<div id="dialog" role="dialog" aria-live="polite">
  <div class="dlg">
    <div class="dlg-portrait" aria-hidden="true"><div class="op-view"></div><div class="scan"></div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><div class="led"></div></div>
    <div class="dlg-main">
      <div class="dlg-name">ARGUS <span>· OVERSEER OF THE TOWER</span></div>
      <p class="dlg-text"></p>
      <div class="dlg-foot"><div class="dlg-choices"></div><span class="dlg-next">CONTINUE <b>▸</b></span></div>
    </div>
  </div>
</div>

<div id="ride"></div>
<div id="flash"></div>
<div id="banner"><div class="b-main"></div><div class="b-sub"></div></div>
<div id="toasts"></div>
<div id="boot"><div class="boot-title">TOWER OF GOD</div><div class="boot-bar"><i></i></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
