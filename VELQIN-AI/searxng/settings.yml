# Minimal SearXNG config for VELQIN (private instance, reachable only from the VELQIN backend).
use_default_settings: true
general:
  instance_name: "VELQIN Search"
  enable_metrics: false
search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json        # required: VELQIN reads results as JSON
server:
  # Overridden by the SEARXNG_SECRET environment variable in compose.yaml.
  secret_key: "change-me-in-compose"
  limiter: false   # not public — only VELQIN talks to it
  image_proxy: false
  method: "GET"
ui:
  static_use_hash: true
