<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1714">
  <title>Barber Empire</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%225%22 y=%221%22 width=%226%22 height=%2214%22 rx=%222%22 fill=%22%23efe4cf%22 stroke=%22%23b58a3c%22/%3E%3Cpath d=%22M5 4l6 3M5 8l6 3%22 stroke=%22%23a8302a%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot { position: fixed; inset: 0; overflow: hidden; background: #120e0b; color: #efe4cf; z-index: 50; transition: opacity .8s ease, transform .8s ease;
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
    #boot.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    /* warm light from a lamp, and a tiled floor running into the dark */
    #boot .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 30%, rgba(255,196,120,.22), rgba(255,170,90,.06) 45%, rgba(0,0,0,0) 70%); animation: flick 5s infinite; }
    @keyframes flick { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .75; } 49% { opacity: 1; } 71% { opacity: .9; } }
    #boot .floor { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 62%; transform-origin: 50% 100%; transform: perspective(500px) rotateX(62deg);
      background: repeating-conic-gradient(#4a3b2e 0 25%, #1c1612 0 50%) 0 0 / 90px 90px; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0) 90%); mask-image: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0) 90%);
      animation: drift 18s linear infinite; }
    @keyframes drift { to { background-position: 0 180px; } }
    #boot .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%); }
    #boot .lamp { position: absolute; left: 50%; top: 0; width: 2px; height: 13vh; background: #3a3029; transform-origin: 50% 0; animation: swing 4.5s ease-in-out infinite; }
    #boot .lamp::after { content: ''; position: absolute; left: -26px; bottom: -22px; width: 54px; height: 26px; border-radius: 27px 27px 4px 4px; background: linear-gradient(#3e6b4a, #2b4a33); box-shadow: 0 14px 40px 10px rgba(255,200,120,.35); }
    #boot .lamp::before { content: ''; position: absolute; left: -7px; bottom: -28px; width: 16px; height: 9px; border-radius: 0 0 9px 9px; background: #fff3d0; box-shadow: 0 0 22px 8px rgba(255,220,150,.7); }
    @keyframes swing { 50% { transform: rotate(2.5deg); } 0%, 100% { transform: rotate(-2.5deg); } }
    #boot .center { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: min(440px, 86vw); }
    /* the barber pole: chrome caps, glass, spinning stripes */
    #boot .pole { position: relative; width: 30px; height: 120px; margin-bottom: 22px; }
    #boot .pole .glass { position: absolute; left: 3px; right: 3px; top: 14px; bottom: 14px; border-radius: 4px; overflow: hidden;
      background: repeating-linear-gradient(-32deg, #b8302b 0 9px, #f6efe2 9px 18px, #24447a 18px 27px, #f6efe2 27px 36px); background-size: 100% 200%; animation: pole 1.4s linear infinite;
      box-shadow: inset 6px 0 8px rgba(0,0,0,.35), inset -5px 0 6px rgba(0,0,0,.3); }
    #boot .pole .glass::after { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 5px; background: linear-gradient(rgba(255,255,255,.65), rgba(255,255,255,.2)); border-radius: 3px; }
    #boot .pole .cap { position: absolute; left: 0; right: 0; height: 16px; border-radius: 8px; background: linear-gradient(90deg, #6d5528, #f2d58f 35%, #fff4d2 45%, #b58a3c 70%, #6d5528); }
    #boot .pole .cap.ct { top: 0; } #boot .pole .cap.cb { bottom: 0; }
    #boot .pole .knob { position: absolute; left: 50%; top: -9px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4d2, #b58a3c 60%, #6d5528); }
    @keyframes pole { to { background-position: 0 -127px; } }
    #boot .k { font-weight: 700; font-size: 12px; letter-spacing: .5em; text-transform: uppercase; color: #d1a956; padding-left: .5em; }
    #boot .logo { font-family: 'DM Serif Display', Georgia, serif; font-size: clamp(46px, 8vw, 78px); line-height: .95; text-align: center; margin: 8px 0 30px; text-shadow: 0 4px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.5); }
    #boot .logo em { font-style: normal; display: block;
      background: linear-gradient(180deg, #fff3cf 0%, #f2cf7c 45%, #b98a33 58%, #e9c46f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    /* progress: a strip of hair being clipped down by scissors */
    #boot .prog { position: relative; width: 100%; height: 22px; }
    #boot .track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: rgba(239,228,207,.12); overflow: hidden; }
    #boot .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #8a6424, #d1a956, #f2cf7c); box-shadow: 0 0 12px rgba(242,207,124,.6); transition: width .35s cubic-bezier(.3,.8,.3,1); }
    #boot .hair { position: absolute; left: 0; right: 0; top: 1px; height: 8px; background: repeating-linear-gradient(90deg, rgba(120,84,50,.9) 0 2px, rgba(0,0,0,0) 2px 4px); -webkit-mask-image: linear-gradient(90deg, #000, #000); clip-path: inset(0 0 0 var(--p, 0%)); opacity: .7; transition: clip-path .35s cubic-bezier(.3,.8,.3,1); }
    #boot .sc { position: absolute; top: -8px; left: 0; width: 34px; height: 34px; margin-left: -17px; transition: left .35s cubic-bezier(.3,.8,.3,1); filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)); }
    #boot .sc .b1 { transform-origin: 17px 17px; animation: snipA .5s ease-in-out infinite; }
    #boot .sc .b2 { transform-origin: 17px 17px; animation: snipB .5s ease-in-out infinite; }
    @keyframes snipA { 50% { transform: rotate(-14deg); } }
    @keyframes snipB { 50% { transform: rotate(14deg); } }
    #boot .row { width: 100%; display: flex; justify-content: space-between; margin-top: 12px; font-weight: 600; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: #b5a588; }
    #boot .pct { color: #efe4cf; font-weight: 700; letter-spacing: .1em; }
    #boot .tipline { position: absolute; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(620px, 88vw); text-align: center; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; color: rgba(239,228,207,.72); transition: opacity .4s; }
    #boot .tipline b { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .3em; font-size: 11px; color: #d1a956; margin-right: 10px; }
    #boot .err { color: #ff9a85; }
    @media (max-height: 560px) {
      #boot .lamp { display: none; }
      #boot .pole { height: 72px; width: 22px; margin-bottom: 10px; }
      #boot .logo { font-size: 44px; margin: 4px 0 16px; }
      #boot .center { top: 48%; }
      #boot .tipline { font-size: 13px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="glow"></div><div class="floor"></div><div class="vig"></div><div class="lamp"></div>
    <div class="center">
      <div class="pole"><div class="knob"></div><div class="cap ct"></div><div class="glass"></div><div class="cap cb"></div></div>
      <div class="k">Est. today &middot; Barbershop</div>
      <div class="logo">Barber<em>Empire</em></div>
      <div class="prog"><div class="hair"></div><div class="track"><i></i></div>
        <svg class="sc" viewBox="0 0 34 34" fill="none" stroke-linecap="round"><g class="b1"><path d="M17 17 L31 11" stroke="#e8e4dc" stroke-width="2.6"/><circle cx="8" cy="22" r="4.2" stroke="#d1a956" stroke-width="2.4"/><path d="M11.5 20 L17 17" stroke="#d1a956" stroke-width="2.4"/></g><g class="b2"><path d="M17 17 L31 23" stroke="#cfcac0" stroke-width="2.6"/><circle cx="8" cy="12" r="4.2" stroke="#d1a956" stroke-width="2.4"/><path d="M11.5 14 L17 17" stroke="#d1a956" stroke-width="2.4"/></g><circle cx="17" cy="17" r="1.6" fill="#fff4d2"/></svg>
      </div>
      <div class="row"><span class="t">Sharpening the razors</span><span class="pct">0%</span></div>
    </div>
    <div class="tipline"><b>TIP</b><span class="tt">Hold the right mouse button to turn the head while you cut.</span></div>
  </div>
  <script>
    (function () {
      var tips = [
        'Hold the right mouse button to turn the head while you cut.',
        'Press C for a close-up of the tricky spots around the ears.',
        'Too fast? Set the clipper speed right above the guards.',
        'One-star customer heading for the door? Walk up behind them…',
        'Flip the door sign to OPEN — the day runs from 8:00 to 21:00.',
        'Walk outside: the whole street is yours, the shops just aren’t open to you.',
        'Play Online, type a shop code, and cut hair together with two colleagues.',
        'Comb the top into shape for Side Part and Slick Back.',
        'Crates hide exclusive dyes and tool skins.'
      ];
      var i = Math.floor(Math.random() * tips.length), el = document.querySelector('#boot .tt'), line = document.querySelector('#boot .tipline');
      el.textContent = tips[i];
      window.__bootTips = setInterval(function () {
        line.style.opacity = 0;
        setTimeout(function () { i = (i + 1) % tips.length; el.textContent = tips[i]; line.style.opacity = 1; }, 400);
      }, 3600);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
