<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1714">
  <title>Barber Empire</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1b1714; color: #efe4cf; font-family: Georgia, serif; z-index: 50; transition: opacity .6s ease; }
    #boot .pole { width: 18px; height: 96px; border-radius: 9px; border: 3px solid #b58a3c;
      background: repeating-linear-gradient(-35deg, #a8302a 0 10px, #efe4cf 10px 20px, #2a4a7a 20px 30px, #efe4cf 30px 40px);
      background-size: 100% 200%; animation: pole 1.6s linear infinite; }
    @keyframes pole { to { background-position: 0 -112px; } }
    #boot .t { margin-top: 22px; font-size: 13px; letter-spacing: .3em; color: #b5a588; text-transform: uppercase; font-family: sans-serif; }
    #boot .bar { margin-top: 12px; width: 180px; height: 3px; background: #3a322b; border-radius: 2px; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0; background: #b58a3c; transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot"><div class="pole"></div><div class="t">Sharpening the razors</div><div class="bar"><i></i></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
